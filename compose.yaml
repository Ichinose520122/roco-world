services:
  app:
    image: ${APP_IMAGE:-ghcr.io/ichinose520122/roco-world:latest}
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      DB_PATH: /app/data/gallery.sqlite
      STORAGE_ROOT: /app/data/images
      BACKUP_DIR: /app/backups
      IMAGE_PROCESS_CONCURRENCY: ${IMAGE_PROCESS_CONCURRENCY:-}
      IMAGE_PROCESS_THREADS: ${IMAGE_PROCESS_THREADS:-}
      IMAGE_PROCESS_CACHE_MB: ${IMAGE_PROCESS_CACHE_MB:-}
      IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-40000000}
    volumes:
      - gallery_data:/app/data
      - gallery_backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-32MB}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  gallery_data:
  gallery_backups:
  caddy_data:
  caddy_config:
