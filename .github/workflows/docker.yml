name: Build Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm run check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: roco-world:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker runtime and health
        run: |
          docker run --rm --entrypoint node roco-world:smoke -e 'if (process.version !== "v24.22.1") throw new Error(`Unexpected Node.js ${process.version}`); console.log(process.version)'
          trap 'docker logs roco-world-smoke; docker rm -f roco-world-smoke' EXIT
          docker run -d --name roco-world-smoke --read-only \
            --tmpfs /tmp:mode=1777 \
            --tmpfs /app/data:uid=1000,gid=1000 \
            --tmpfs /app/backups:uid=1000,gid=1000 \
            roco-world:smoke
          for attempt in $(seq 1 30); do
            if docker exec roco-world-smoke node -e 'fetch("http://127.0.0.1:3000/healthz", { signal: AbortSignal.timeout(3000) }).then(async r => { if (!r.ok || (await r.json()).ok !== true) process.exit(1); }).catch(() => process.exit(1))'; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
